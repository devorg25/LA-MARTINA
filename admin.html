<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA MARTINA | Admin</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:14px "DM Sans",sans-serif}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.brand{font:38px "Cormorant Garamond";letter-spacing:5px;color:#e1c17e}.muted{color:#999}input,select,textarea{padding:12px;background:#111;color:#fff;border:1px solid #51452e;margin:5px 0;width:100%}button{padding:12px 18px;background:#c8a45d;color:#090909;border:0;cursor:pointer;margin:5px 0}.panel{background:#111;border:1px solid #3b3223;padding:22px;margin:20px 0}.hidden{display:none}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #333}@media(max-width:650px){.row{grid-template-columns:1fr}table{font-size:12px}}
</style></head><body><div class="wrap"><a href="index.html" class="muted">← Back to website</a><div class="brand">LA MARTINA</div><p class="muted">Restaurant management</p>
<section id="login" class="panel"><h2>Admin sign in</h2><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>Reservations</h2><button id="refresh">Refresh</button><div id="reservations"></div></div>
<div class="panel"><h2>Add menu item</h2><form id="itemForm"><div class="row"><input name="name" placeholder="Dish name" required><input name="price" type="number" min="0" step="0.01" placeholder="Price (DA)" required><select name="category_id" id="category" required></select><input name="image_url" type="url" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea></div><button>Add item</button></form><p id="itemMsg" class="muted"></p></div>
<div class="panel"><h2>Menu items</h2><div id="items"></div></div><button id="logout">Sign out</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.LA_MARTINA_CONFIG;const db=supabase.createClient(cfg.url,cfg.key);const $=id=>document.getElementById(id);
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});$('loginMsg').textContent=error?error.message:'';if(!error)show()});
async function show(){const {data:{user}}=await db.auth.getUser();if(!user)return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await refresh()}
async function refresh(){const {data:cats}=await db.from('menu_categories').select('id,name').order('sort_order');$('category').innerHTML=(cats||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');const {data:r,error:re}=await db.from('reservations').select('*').order('created_at',{ascending:false});$('reservations').innerHTML=re?re.message:(r||[]).map(x=>`<p>${esc(x.customer_name)} · ${esc(x.phone)} · ${x.reservation_date} ${x.reservation_time} · ${x.guests} guests · <b>${esc(x.status)}</b> <select data-res="${x.id}"><option>pending</option><option>confirmed</option><option>cancelled</option><option>completed</option></select> <button data-save="${x.id}">Save</button></p>`).join('')||'No reservations yet';const {data:items,error}=await db.from('menu_items').select('id,name,price,is_available').order('created_at',{ascending:false});$('items').innerHTML=error?error.message:(items||[]).map(x=>`<p>${esc(x.name)} — ${x.price} DA — ${x.is_available?'Available':'Hidden'} <button data-toggle="${x.id}" data-value="${x.is_available}">${x.is_available?'Hide':'Show'}</button> <button data-delete="${x.id}">Delete</button></p>`).join('')||'No menu items yet';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('refresh').onclick=refresh;$('reservations').addEventListener('click',async e=>{const id=e.target.dataset.save;if(id){const status=e.target.parentElement.querySelector('select').value;await db.from('reservations').update({status}).eq('id',id);refresh()}});$('items').addEventListener('click',async e=>{if(e.target.dataset.toggle){await db.from('menu_items').update({is_available:e.target.dataset.value!=='true'}).eq('id',e.target.dataset.toggle);refresh()}if(e.target.dataset.delete){if(confirm('Delete this menu item?')){await db.from('menu_items').delete().eq('id',e.target.dataset.delete);refresh()}}});
$('itemForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),data=Object.fromEntries(f);data.price=Number(data.price);const {error}=await db.from('menu_items').insert(data);$('itemMsg').textContent=error?error.message:'Item added.';if(!error){e.currentTarget.reset();refresh()}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(({data})=>{if(data.session)show()});
</script></body></html>
